<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compression Web</title>
<style>
    :root {
        color-scheme: light dark;
        --bg: #f6f5f1;
        --fg: #1f1d1a;
        --muted: #6b6660;
        --accent: #2f6e4f;
        --border: #d9d3c7;
        --tile-bg: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
        :root {
            --bg: #1a1916;
            --fg: #ece8df;
            --muted: #9a958c;
            --accent: #6abf8b;
            --border: #3a3630;
            --tile-bg: #25221d;
        }
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        padding: 2rem 1rem;
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--fg);
        display: flex;
        justify-content: center;
    }
    main {
        width: 100%;
        max-width: 540px;
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
    }
    h1 { margin: 0; font-size: 1.5rem; font-weight: 600; }
    h2 { margin: 0 0 0.5rem; font-size: 1.05rem; font-weight: 600; }
    #drop-zone {
        border: 2px dashed var(--border);
        border-radius: 8px;
        padding: 2rem 1rem;
        text-align: center;
        color: var(--muted);
        cursor: pointer;
    }
    #drop-zone:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
    fieldset { border: none; padding: 0; margin: 0; }
    legend { padding: 0; }
    label { display: block; font-size: 0.9rem; color: var(--muted); margin-bottom: 0.25rem; }
    select, input[type="checkbox"] { font: inherit; }
    select { padding: 0.3rem; }
    #docx-options {
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 0.6rem 0.8rem;
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
    }
    #docx-options legend { font-size: 0.9rem; color: var(--muted); }
    #docx-options label { display: flex; align-items: center; gap: 0.4rem; margin: 0; color: var(--fg); font-size: 0.95rem; }
    #convert {
        background: var(--accent);
        color: white;
        border: none;
        border-radius: 6px;
        padding: 0.6rem 1rem;
        font-size: 1rem;
        cursor: pointer;
    }
    #convert:disabled { opacity: 0.5; cursor: not-allowed; }
    #status { margin: 0; min-height: 1.2em; }
    #errors { margin: 0; padding-left: 1.2rem; color: var(--accent); }
    .formats { font-size: 0.8rem; color: var(--muted); margin: 0; }
    .summary {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.75rem;
        padding: 0.75rem;
        background: var(--tile-bg);
        border: 1px solid var(--border);
        border-radius: 8px;
    }
    .metric {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 0.5rem;
    }
    .metric-value {
        font-size: 1.4rem;
        font-weight: 600;
        color: var(--accent);
        font-variant-numeric: tabular-nums;
    }
    .metric-label {
        font-size: 0.8rem;
        color: var(--muted);
        margin-top: 0.2rem;
    }
    .history {
        padding: 0.75rem 1rem;
        background: var(--tile-bg);
        border: 1px solid var(--border);
        border-radius: 8px;
    }
    .history h2 { color: var(--muted); font-weight: 500; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.05em; }
    #history-list {
        margin: 0;
        padding-left: 0;
        list-style: none;
        max-height: 12rem;
        overflow-y: auto;
    }
    #history-list li {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        padding: 0.35rem 0;
        border-bottom: 1px solid var(--border);
        font-size: 0.9rem;
    }
    #history-list li:last-child { border-bottom: none; }
    .hist-name {
        flex: 1 1 auto;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        margin-right: 0.5rem;
    }
    .hist-saved {
        flex: 0 0 auto;
        color: var(--accent);
        font-variant-numeric: tabular-nums;
        font-size: 0.85rem;
    }
</style>
</head>
<body>
<main>
    <h1>Compression Web</h1>
    <p class="formats">Accepted formats: PDF, DOCX. Max 100&nbsp;MB per file.</p>

    <fieldset>
        <legend><label for="files">Select files</label></legend>
        <div id="drop-zone" tabindex="0" aria-label="Drop zone. Click to browse or drag files here.">
            <span>Drop files here or click to browse</span>
            <input type="file" id="files" accept=".pdf,.docx" multiple hidden>
        </div>
    </fieldset>

    <fieldset>
        <legend><label for="level">Compression level</label></legend>
        <select id="level" name="level">
            <option value="low">Low (lightest compression, best fidelity)</option>
            <option value="medium" selected>Medium (balanced)</option>
            <option value="high">High (strongest compression, smallest files)</option>
        </select>
    </fieldset>

    <fieldset id="docx-options" hidden>
        <legend>DOCX options</legend>
        <label><input type="checkbox" id="strip-tracked-changes"> Strip tracked changes</label>
        <label><input type="checkbox" id="strip-comments"> Strip comments</label>
        <label><input type="checkbox" id="strip-metadata" checked> Strip metadata</label>
    </fieldset>

    <button id="convert" type="button" disabled>Compress &amp; download</button>

    <section id="summary" class="summary" hidden>
        <div class="metric">
            <div class="metric-value" id="totalSavedMB">0.00 MB</div>
            <div class="metric-label">saved this session</div>
        </div>
        <div class="metric">
            <div class="metric-value" id="filesProcessed">0</div>
            <div class="metric-label">files processed</div>
        </div>
    </section>

    <section id="history" class="history" hidden>
        <h2>Recent compressions</h2>
        <ul id="history-list"></ul>
    </section>

    <p id="status" role="status" aria-live="polite">No files selected.</p>
    <ul id="errors"></ul>
</main>
<script src="lib/jszip.min.js"></script>
<script src="lib/pdf-lib.min.js"></script>
<script src="lib/pdf.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
